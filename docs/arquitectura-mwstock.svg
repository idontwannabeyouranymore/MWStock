<svg viewBox="0 0 860 800" width="860" height="800" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="fl" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M2,2 L9,6 L2,10" fill="none" stroke="#888780" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="800" fill="#ffffff"/>

  <text x="40" y="42" font-size="22" font-weight="bold" fill="#2C2C2A">Arquitectura en capas — MWStock</text>
  <text x="40" y="66" font-size="14" fill="#5F5E5A">Mapeo al patrón MVC de Laravel</text>

  <rect x="40" y="84" width="14" height="14" rx="3" fill="#5DCAA5"/>
  <text x="60" y="95" font-size="12.5" fill="#444441">Vista</text>
  <rect x="140" y="84" width="14" height="14" rx="3" fill="#AFA9EC"/>
  <text x="160" y="95" font-size="12.5" fill="#444441">Controlador</text>
  <rect x="300" y="84" width="14" height="14" rx="3" fill="#EF9F27"/>
  <text x="320" y="95" font-size="12.5" fill="#444441">Modelo</text>
  <rect x="430" y="84" width="14" height="14" rx="3" fill="#B4B2A9"/>
  <text x="450" y="95" font-size="12.5" fill="#444441">Apoyo / infraestructura</text>

  <rect x="40" y="120" width="780" height="110" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="64" y="158" font-size="17" font-weight="bold" fill="#085041">1 · Presentación  —  Vista</text>
  <text x="64" y="186" font-size="13" fill="#0F6E56">app/tienda · app/administrador · app/dueno · app/login · components/</text>
  <text x="64" y="212" font-size="13" fill="#0F6E56">Laravel:  Vistas (Blade)</text>
  <line x1="430" y1="230" x2="430" y2="252" stroke="#888780" stroke-width="1.8" marker-end="url(#fl)"/>

  <rect x="40" y="252" width="780" height="110" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="64" y="290" font-size="17" font-weight="bold" fill="#3C3489">2 · Ruteo y control  —  Controlador</text>
  <text x="64" y="318" font-size="13" fill="#534AB7">middleware.ts · app/api/.../route.ts  (validan, autorizan, responden)</text>
  <text x="64" y="344" font-size="13" fill="#534AB7">Laravel:  Rutas + Controllers + Middleware</text>
  <line x1="430" y1="362" x2="430" y2="384" stroke="#888780" stroke-width="1.8" marker-end="url(#fl)"/>

  <rect x="40" y="384" width="780" height="110" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
  <text x="64" y="422" font-size="17" font-weight="bold" fill="#2C2C2A">3 · Servicios / lógica</text>
  <text x="64" y="450" font-size="13" fill="#5F5E5A">lib/auth · lib/session (JWT) · lib/cloudinary · lib/dominios</text>
  <text x="64" y="476" font-size="13" fill="#5F5E5A">Laravel:  Services / Helpers</text>
  <line x1="430" y1="494" x2="430" y2="516" stroke="#888780" stroke-width="1.8" marker-end="url(#fl)"/>

  <rect x="40" y="516" width="780" height="110" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="64" y="554" font-size="17" font-weight="bold" fill="#633806">4 · Acceso a datos  —  Modelo</text>
  <text x="64" y="582" font-size="13" fill="#854F0B">lib/prisma (ORM) · prisma/schema.prisma  (Usuario, Tienda, Producto, Venta…)</text>
  <text x="64" y="608" font-size="13" fill="#854F0B">Laravel:  Eloquent + Modelos + Migraciones</text>
  <line x1="430" y1="626" x2="430" y2="648" stroke="#888780" stroke-width="1.8" marker-end="url(#fl)"/>

  <rect x="40" y="648" width="780" height="110" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
  <text x="64" y="686" font-size="17" font-weight="bold" fill="#2C2C2A">5 · Datos y servicios externos</text>
  <text x="64" y="714" font-size="13" fill="#5F5E5A">PostgreSQL (Supabase) · Cloudinary (imágenes)</text>
  <text x="64" y="740" font-size="13" fill="#5F5E5A">Laravel:  Base de datos</text>

  <text x="430" y="786" font-size="12.5" fill="#5F5E5A" text-anchor="middle">Petición  ↓      ·      Respuesta  ↑</text>
</svg>
